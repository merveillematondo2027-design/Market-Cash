name: Manual wallet deposit deploy
on:
  push:
    paths:
      - 'scripts/add_manual_wallet_deposit.py'
  workflow_dispatch:
permissions:
  contents: write
  id-token: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply manual deposit UI
        run: python3 scripts/add_manual_wallet_deposit.py
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install frontend
        run: npm install
      - name: Build frontend
        run: npm run build
      - name: Install functions
        working-directory: functions
        run: npm install
      - name: Build functions
        working-directory: functions
        run: npm run build
      - name: Commit manual deposit UI
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/client/WalletAction.tsx
          git diff --cached --quiet || git commit -m "Add manual SMS-controlled wallet recharge option"
          git push
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/153173040202/locations/global/workloadIdentityPools/github-actions/providers/market-cash
          service_account: market-cash-github-deployer@automarket-fintech.iam.gserviceaccount.com
      - name: Install Firebase CLI
        run: npm install -g firebase-tools
      - name: Deploy manual deposit functions
        run: firebase deploy --project automarket-fintech --only functions:createManualWalletDeposit,functions:checkManualWalletDeposit
      - name: Deploy Hosting and Storage rules
        run: firebase deploy --project automarket-fintech --only hosting,storage
