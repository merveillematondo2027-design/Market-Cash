          old="""{action==='receive'&&<div className=\"mt-6\">{secure.revealed?<div className=\"rounded-3xl bg-slate-50 p-5 text-center\"><div className=\"mx-auto inline-block rounded-3xl bg-white p-4 shadow-sm\">{identity?<QRCodeSVG value={`MARKET-CASH-WALLET:${identity}`} size={190}/>:<div className=\"grid h-[190px] w-[190px] place-items-center text-slate-400\">Chargement…</div>}</div><p className=\"mt-4 text-xs font-black uppercase text-slate-400\">Votre ID Wallet</p><p className=\"mt-1 font-mono text-xl font-black text-blue-950\">{identity||'—'}</p><p className=\"mt-2 text-xs text-slate-500\">Partagez cet ID pour recevoir un transfert Market-Cash.</p></div>:<button onClick={secure.request} className=\"w-full rounded-3xl border border-blue-200 bg-blue-50 p-6 text-center text-blue-950\"><QrCode className=\"mx-auto\"/><b className=\"mt-3 block\">Afficher mon ID et mon QR</b><span className=\"mt-1 block text-xs text-blue-700\">Code secret de l'application requis.</span></button>}</div>}"""
          new="""{action==='receive'&&<div className=\"mt-6\"><div className=\"rounded-3xl bg-slate-50 p-5 text-center\"><div className=\"mx-auto inline-block rounded-3xl bg-white p-4 shadow-sm\">{identity?<QRCodeSVG value={`MARKET-CASH-WALLET:${identity}`} size={190}/>:<div className=\"grid h-[190px] w-[190px] place-items-center text-slate-400\">Chargement…</div>}</div><p className=\"mt-4 text-xs font-black uppercase text-slate-400\">Votre ID Wallet</p><p className=\"mt-1 font-mono text-xl font-black text-blue-950\">{identity||'—'}</p><p className=\"mt-2 text-xs text-slate-500\">Partagez cet ID pour recevoir un transfert Market-Cash.</p></div></div>}"""
