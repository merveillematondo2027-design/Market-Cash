    tx.update(senderWalletRef, { availableBalance: roundTransactionMoney(Number(sender.availableBalance || 0) - totalDebited), ledgerBalance: roundTransactionMoney(Number(sender.ledgerBalance || 0) - totalDebited), updatedAt: now });
    tx.update(recipientWalletRef, { availableBalance: roundTransactionMoney(Number(recipient.availableBalance || 0) + amount), ledgerBalance: roundTransactionMoney(Number(recipient.ledgerBalance || 0) + amount), updatedAt: now });
    tx.set(revenueRef,{id:revenueRef.id,currency,availableBalance:FieldValue.increment(feeAmount),ledgerBalance:FieldValue.increment(feeAmount),updatedAt:now,createdAt:now},{merge:true});
    tx.set(txRef, { id: txId, reference, type: 'local_transfer', status: 'settled', currency, amount, feeAmount, totalDebited, senderId: senderUid, recipientId: recipientUid, userIds: [senderUid, recipientUid], sourceWalletId: senderWalletRef.id, destinationWalletId: recipientWalletRef.id, rail: 'market_cash_local', authenticatedBy: 'local_cvv', createdAt: now, updatedAt: now });
