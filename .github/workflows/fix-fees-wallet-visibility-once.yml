      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install frontend dependencies
        run: npm install --no-audit --no-fund

      - name: Build frontend
        run: npm run build

      - name: Install Functions dependencies
        working-directory: functions
        run: npm install --no-audit --no-fund

      - name: Build Functions
        working-directory: functions
        run: npm run build

      - name: Commit corrected fee model
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add functions/src/transactionFees.ts functions/src/security.ts functions/src/identityV2.ts functions/src/developerPayments.ts src/pages/client/ClientHome.tsx src/pages/client/WalletAction.tsx
          git commit -m "Fix transaction fees commissions and wallet visibility"
          git push origin main

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: 'projects/153173040202/locations/global/workloadIdentityPools/github-actions/providers/market-cash'
          service_account: 'market-cash-github-deployer@automarket-fintech.iam.gserviceaccount.com'

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Deploy affected Functions
        run: firebase deploy --only functions:marketCashApiCardPayment,functions:marketCashApiCardPaymentByKey,functions:marketCashTransferWithCvv,functions:merchantPaymentFromLocalCardWithCvvV2,functions:agentLocalCardCashOutWithCvv,functions:agentCashInByMarketCashIdV2 --project automarket-fintech --non-interactive

      - name: Deploy frontend Hosting
        run: firebase deploy --only hosting --project automarket-fintech --non-interactive
