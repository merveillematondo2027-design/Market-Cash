name: Market-Cash Functions Deploy

on:
  push:
    branches: [main]
    paths:
      - 'functions/**'
      - 'firebase.json'
      - '.github/workflows/functions-deploy.yml'
  workflow_dispatch:

concurrency:
  group: market-cash-functions-deploy
  cancel-in-progress: true

jobs:
  deploy-functions:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Functions dependencies
        working-directory: functions
        run: npm install --no-audit --no-fund
      - name: Build Functions
        working-directory: functions
        run: npm run build
      - name: Reduce Gen2 CPU for quota-limited deployment
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          changed = 0
          for path in Path('functions/lib').rglob('*.js'):
              text = path.read_text()
              updated = text.replace('{ region: REGION }', "{ region: REGION, cpu: 'gcf_gen1' }")
              if updated != text:
                  path.write_text(updated)
                  changed += 1
          print(f'Patched compiled function files: {changed}')
          if changed == 0:
              raise SystemExit('No Firebase Gen2 region options were patched; refusing deployment.')
          PY
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: 'projects/153173040202/locations/global/workloadIdentityPools/github-actions/providers/market-cash'
          service_account: 'market-cash-github-deployer@automarket-fintech.iam.gserviceaccount.com'
      - name: Install Firebase CLI
        run: npm install -g firebase-tools
      - name: Select Functions to deploy
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t function_changes < <(git diff --name-only HEAD^ HEAD -- functions/src || true)
          treasury_set=0; treasury_file_seen=0
          if [ "${#function_changes[@]}" -gt 0 ]; then
            treasury_set=1
            for file in "${function_changes[@]}"; do
              case "$file" in
                functions/src/adminTreasury.ts) treasury_file_seen=1 ;;
                functions/src/entry.ts) ;;
                *) treasury_set=0 ;;
              esac
            done
            [ "$treasury_file_seen" -eq 1 ] || treasury_set=0
          fi
          payment_control_set=0; payment_file_seen=0
          if [ "${#function_changes[@]}" -gt 0 ]; then
            payment_control_set=1
            for file in "${function_changes[@]}"; do case "$file" in functions/src/paymentControl.ts) payment_file_seen=1 ;; functions/src/entry.ts) ;; *) payment_control_set=0 ;; esac; done
            [ "$payment_file_seen" -eq 1 ] || payment_control_set=0
          fi
          bridge_set=0; bridge_file_seen=0
          if [ "${#function_changes[@]}" -gt 0 ]; then
            bridge_set=1
            for file in "${function_changes[@]}"; do case "$file" in functions/src/apiKeyCardPayment.ts) bridge_file_seen=1 ;; functions/src/entry.ts) ;; *) bridge_set=0 ;; esac; done
            [ "$bridge_file_seen" -eq 1 ] || bridge_set=0
          fi
          local_pair_set=0; local_pair_file_seen=0
          if [ "${#function_changes[@]}" -gt 0 ]; then
            local_pair_set=1
            for file in "${function_changes[@]}"; do case "$file" in functions/src/localCardPair.ts|functions/src/localCardPairOperations.ts|functions/src/adminLocalCardProvisioning.ts) local_pair_file_seen=1 ;; functions/src/entry.ts) ;; *) local_pair_set=0 ;; esac; done
            [ "$local_pair_file_seen" -eq 1 ] || local_pair_set=0
          fi
          admin_balance_set=0; admin_balance_file_seen=0
          if [ "${#function_changes[@]}" -gt 0 ]; then
            admin_balance_set=1
            for file in "${function_changes[@]}"; do
              case "$file" in
                functions/src/adminWalletAdjustments.ts|functions/src/agentAdmin.ts) admin_balance_file_seen=1 ;;
                functions/src/entry.ts) ;;
                *) admin_balance_set=0 ;;
              esac
            done
            [ "$admin_balance_file_seen" -eq 1 ] || admin_balance_set=0
          fi
          priority_set=0; priority_file_seen=0
          if [ "${#function_changes[@]}" -gt 0 ]; then
            priority_set=1
            for file in "${function_changes[@]}"; do case "$file" in functions/src/cardProvisioningV2.ts|functions/src/security.ts) priority_file_seen=1 ;; functions/src/entry.ts) ;; *) priority_set=0 ;; esac; done
            [ "$priority_file_seen" -eq 1 ] || priority_set=0
          fi
          if [ "$treasury_set" -eq 1 ]; then
            cat > /tmp/market-cash-functions.txt <<'EOF'
          getAdminTreasurySnapshot
          revealAdminTreasuryCvv
          resetAdminTreasuryCvv
          adjustAdminTreasury
          EOF
            echo 'Focused admin treasury deployment selected.'
            echo '2' > /tmp/market-cash-batch-size.txt
          elif [ "$payment_control_set" -eq 1 ]; then
            cat > /tmp/market-cash-functions.txt <<'EOF'
          paymentBridgeIngestSms
          adminReparsePaymentSms
          adminVerifyPaymentEvidence
          adminConsumePaymentEvent
          EOF
            echo 'Focused Payment Control deployment selected.'
            echo '2' > /tmp/market-cash-batch-size.txt
          elif [ "$bridge_set" -eq 1 ]; then
            echo marketCashApiCardPaymentByKey > /tmp/market-cash-functions.txt; echo '1' > /tmp/market-cash-batch-size.txt
          elif [ "$admin_balance_set" -eq 1 ]; then
            cat > /tmp/market-cash-functions.txt <<'EOF'
          adminAdjustUserWalletBalance
          getMyAgentAccountSnapshot
          adminGetAgentDetails
          adminFundAgentFloatV2
          adminReduceAgentFloatV2
          ensureLocalCardPairV3
          getMyLocalCardPairV3
          revealLocalCardV3
          setLocalCardBlockedV3
          resetLocalCardSecurityV3
          fundLocalCardV3
          adminProvisionLocalCardPairsV3
          provisionLocalCardsOnUserCreatedV3
          EOF
            echo 'Focused admin balances + local-card deployment selected.'
            echo '2' > /tmp/market-cash-batch-size.txt
          elif [ "$local_pair_set" -eq 1 ]; then
            cat > /tmp/market-cash-functions.txt <<'EOF'
          ensureLocalCardPairV3
          getMyLocalCardPairV3
          revealLocalCardV3
          setLocalCardBlockedV3
          resetLocalCardSecurityV3
          fundLocalCardV3
          adminProvisionLocalCardPairsV3
          provisionLocalCardsOnUserCreatedV3
          EOF
            echo 'Focused local-card pair deployment selected.'
            echo '2' > /tmp/market-cash-batch-size.txt
          elif [ "$priority_set" -eq 1 ]; then
            cat > /tmp/market-cash-functions.txt <<'EOF'
          verifyApplicationSecret
          changeApplicationPin
          activateLocalMarketCashCardV2
          getMyLocalMarketCashCardsV3
          syncLocalCardSecurityProfile
          getClientSecurityOverview
          revealLocalCardSecureData
          rotateMarketCashLocalCvv
          walletToLocalCardWithCvv
          marketCashTransferWithCvv
          merchantPaymentFromLocalCardWithCvv
          agentLocalCardCashOutWithCvv
          EOF
            echo '1' > /tmp/market-cash-batch-size.txt
          else
            node <<'NODE' > /tmp/market-cash-functions.txt
          const mod = require('./functions/lib/entry.js');
          const blockedUntilIamReady = new Set(['onKycRequestApproved', 'onClientKycApproved']);
          for (const [name, value] of Object.entries(mod)) if (typeof value === 'function' && value.__endpoint && !blockedUntilIamReady.has(name)) console.log(name);
          NODE
            sort -u /tmp/market-cash-functions.txt -o /tmp/market-cash-functions.txt
            echo '2' > /tmp/market-cash-batch-size.txt
          fi
          echo 'Functions selected:'
          cat /tmp/market-cash-functions.txt
          test -s /tmp/market-cash-functions.txt
      - name: Deploy Cloud Functions conservatively with retry
        shell: bash
        run: |
          set -uo pipefail
          mapfile -t functions_to_deploy < /tmp/market-cash-functions.txt
          batch_size="$(cat /tmp/market-cash-batch-size.txt)"
          for ((i=0; i<${#functions_to_deploy[@]}; i+=batch_size)); do
            only=''; batch=()
            for ((j=i; j<i+batch_size && j<${#functions_to_deploy[@]}; j++)); do
              fn="${functions_to_deploy[$j]}"; [ -z "$fn" ] && continue; batch+=("$fn")
              if [ -z "$only" ]; then only="functions:${fn}"; else only="${only},functions:${fn}"; fi
            done
            [ -z "$only" ] && continue
            success=0
            for attempt in 1 2 3; do
              echo "Deploying: ${batch[*]} (attempt ${attempt}/3)"
              if firebase deploy --only "$only" --project automarket-fintech --non-interactive; then success=1; break; fi
              sleep $((attempt * 35))
            done
            [ "$success" -eq 1 ] || exit 1
            sleep 12
          done