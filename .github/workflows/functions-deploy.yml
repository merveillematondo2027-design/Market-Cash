name: Market-Cash Functions Deploy

on:
  push:
    branches: [main]
    paths:
      - 'functions/**'
      - 'firebase.json'
      - '.github/workflows/functions-deploy.yml'
  workflow_dispatch:

concurrency:
  group: market-cash-functions-deploy
  cancel-in-progress: false

jobs:
  deploy-functions:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Functions dependencies
        working-directory: functions
        run: npm install --no-audit --no-fund

      - name: Build Functions
        working-directory: functions
        run: npm run build

      - name: Reduce Gen2 CPU for quota-limited deployment
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          changed = 0
          for path in Path('functions/lib').rglob('*.js'):
              text = path.read_text()
              updated = text.replace(
                  '{ region: REGION }',
                  "{ region: REGION, cpu: 'gcf_gen1' }",
              )
              if updated != text:
                  path.write_text(updated)
                  changed += 1

          print(f'Patched compiled function files: {changed}')
          if changed == 0:
              raise SystemExit('No Firebase Gen2 region options were patched; refusing deployment.')
          PY

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: 'projects/153173040202/locations/global/workloadIdentityPools/github-actions/providers/market-cash'
          service_account: 'market-cash-github-deployer@automarket-fintech.iam.gserviceaccount.com'

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Discover Firebase function exports
        shell: bash
        run: |
          set -euo pipefail

          # Targeted deploys avoid redeploying the complete historical function
          # set when only the local-card rail or legacy spending guards changed.
          explicit_local_card_only=0
          local_card_only=0
          legacy_spending_guard_only=0
          if git rev-parse HEAD^ >/dev/null 2>&1; then
            mapfile -t function_changes < <(git diff --name-only HEAD^ HEAD -- functions/src)
            echo 'Changed function sources:'
            printf '%s\n' "${function_changes[@]:-}"

            if [ "${#function_changes[@]}" -eq 1 ] \
              && [ "${function_changes[0]}" = 'functions/src/entry.ts' ] \
              && grep -q 'LEGACY_LOCAL_CARD_SPENDING_GUARD' functions/src/entry.ts; then
              legacy_spending_guard_only=1
            fi

            explicit_local_card_only=1
            for file in "${function_changes[@]}"; do
              case "$file" in
                functions/src/localCardExplicit.ts|functions/src/entry.ts) ;;
                *) explicit_local_card_only=0 ;;
              esac
            done
            [ "${#function_changes[@]}" -gt 0 ] || explicit_local_card_only=0
            printf '%s\n' "${function_changes[@]}" | grep -qx 'functions/src/localCardExplicit.ts' || explicit_local_card_only=0

            local_card_only=1
            for file in "${function_changes[@]}"; do
              case "$file" in
                functions/src/localCard.ts|functions/src/entry.ts) ;;
                *) local_card_only=0 ;;
              esac
            done
            [ "${#function_changes[@]}" -gt 0 ] || local_card_only=0
            printf '%s\n' "${function_changes[@]}" | grep -qx 'functions/src/localCard.ts' || local_card_only=0
          fi

          if [ "$legacy_spending_guard_only" -eq 1 ]; then
            cat > /tmp/market-cash-functions.txt <<'EOF'
          merchantPayment
          createWithdrawalAuthorization
          redeemWithdrawalAuthorization
          agentCashOut
          walletToInternalCard
          agentCardCashOut
          EOF
            echo 'Legacy spending guard change detected: deploying only blocked legacy endpoints.'
          elif [ "$explicit_local_card_only" -eq 1 ]; then
            cat > /tmp/market-cash-functions.txt <<'EOF'
          activateLocalMarketCashCard
          getMyLocalMarketCashCardsV2
          walletToLocalMarketCashCardV2
          merchantPaymentFromLocalCardV2
          EOF
            echo 'Explicit local-card change detected: deploying only the V2 local-card endpoints.'
          elif [ "$local_card_only" -eq 1 ]; then
            cat > /tmp/market-cash-functions.txt <<'EOF'
          ensureLocalMarketCashCard
          getMyLocalMarketCashCards
          walletToLocalMarketCashCard
          merchantPaymentFromLocalCard
          lookupLocalMarketCashCardForWithdrawal
          agentLocalCardCashOut
          adminResetVisaTestData
          EOF
            echo 'Local-card change detected: deploying only the dedicated endpoints.'
          else
            node <<'NODE' > /tmp/market-cash-functions.txt
          const mod = require('./functions/lib/entry.js');
          for (const [name, value] of Object.entries(mod)) {
            if (typeof value === 'function' && value.__endpoint) {
              console.log(name);
            }
          }
          NODE
            echo 'General Functions change detected: full export set selected.'
          fi

          echo 'Functions selected:'
          cat /tmp/market-cash-functions.txt
          test -s /tmp/market-cash-functions.txt

      - name: Deploy Cloud Functions sequentially with retry
        shell: bash
        run: |
          set -uo pipefail
          while IFS= read -r fn; do
            [ -z "$fn" ] && continue
            success=0
            for attempt in 1 2 3; do
              echo "Deploying functions:${fn} (attempt ${attempt}/3)"
              if firebase deploy \
                --only "functions:${fn}" \
                --project automarket-fintech \
                --non-interactive; then
                success=1
                break
              fi
              wait_seconds=$((attempt * 30))
              echo "Transient deployment failure for ${fn}; retrying in ${wait_seconds}s..."
              sleep "$wait_seconds"
            done
            if [ "$success" -ne 1 ]; then
              echo "Function ${fn} failed after 3 attempts."
              exit 1
            fi
            sleep 10
          done < /tmp/market-cash-functions.txt
