name: Market-Cash Functions Deploy

on:
  push:
    branches: [main]
    paths:
      - 'functions/**'
      - 'firebase.json'
      - '.github/workflows/functions-deploy.yml'
  workflow_dispatch:

concurrency:
  group: market-cash-functions-deploy
  cancel-in-progress: true

jobs:
  deploy-functions:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Functions dependencies
        working-directory: functions
        run: npm install --no-audit --no-fund

      - name: Build Functions
        working-directory: functions
        run: npm run build

      - name: Reduce Gen2 CPU for quota-limited deployment
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          changed = 0
          for path in Path('functions/lib').rglob('*.js'):
              text = path.read_text()
              updated = text.replace(
                  '{ region: REGION }',
                  "{ region: REGION, cpu: 'gcf_gen1' }",
              )
              if updated != text:
                  path.write_text(updated)
                  changed += 1

          print(f'Patched compiled function files: {changed}')
          if changed == 0:
              raise SystemExit('No Firebase Gen2 region options were patched; refusing deployment.')
          PY

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: 'projects/153173040202/locations/global/workloadIdentityPools/github-actions/providers/market-cash'
          service_account: 'market-cash-github-deployer@automarket-fintech.iam.gserviceaccount.com'

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Select Functions to deploy
        shell: bash
        run: |
          set -euo pipefail

          mapfile -t function_changes < <(git diff --name-only HEAD^ HEAD -- functions/src || true)
          echo 'Changed function sources:'
          printf '%s\n' "${function_changes[@]:-}"

          bridge_set=0
          if [ "${#function_changes[@]}" -eq 0 ]; then
            # Workflow-only/manual runs are used as a fast recovery path for the
            # MUNGWELE IA server-to-server Market-Cash bridge.
            bridge_set=1
          else
            bridge_set=1
            for file in "${function_changes[@]}"; do
              case "$file" in
                functions/src/apiKeyCardPayment.ts|functions/src/entry.ts) ;;
                *) bridge_set=0 ;;
              esac
            done
          fi

          priority_set=0
          if [ "${#function_changes[@]}" -eq 0 ]; then
            priority_set=0
          else
            priority_set=1
            for file in "${function_changes[@]}"; do
              case "$file" in
                functions/src/cardProvisioningV2.ts|functions/src/security.ts|functions/src/entry.ts) ;;
                *) priority_set=0 ;;
              esac
            done
          fi

          # Firestore Eventarc triggers currently require project-level IAM bindings
          # that the GitHub deployer is not allowed to grant. The application does
          # not depend on them for interactive recovery because the callable local
          # card endpoints self-heal verified historical accounts.
          if [ "$bridge_set" -eq 1 ]; then
            cat > /tmp/market-cash-functions.txt <<'EOF'
          marketCashApiCardPaymentByKey
          EOF
            echo 'Fast Market-Cash API-key payment bridge deployment selected.'
            echo '1' > /tmp/market-cash-batch-size.txt
          elif [ "$priority_set" -eq 1 ]; then
            cat > /tmp/market-cash-functions.txt <<'EOF'
          verifyApplicationSecret
          changeApplicationPin
          activateLocalMarketCashCardV2
          getMyLocalMarketCashCardsV3
          syncLocalCardSecurityProfile
          getClientSecurityOverview
          revealLocalCardSecureData
          rotateMarketCashLocalCvv
          walletToLocalCardWithCvv
          marketCashTransferWithCvv
          merchantPaymentFromLocalCardWithCvv
          agentLocalCardCashOutWithCvv
          EOF
            echo 'Priority callable security/KYC and secure transaction deployment selected.'
            echo '1' > /tmp/market-cash-batch-size.txt
          else
            node <<'NODE' > /tmp/market-cash-functions.txt
          const mod = require('./functions/lib/entry.js');
          const blockedUntilIamReady = new Set(['onKycRequestApproved', 'onClientKycApproved']);
          for (const [name, value] of Object.entries(mod)) {
            if (typeof value === 'function' && value.__endpoint && !blockedUntilIamReady.has(name)) {
              console.log(name);
            }
          }
          NODE
            sort -u /tmp/market-cash-functions.txt -o /tmp/market-cash-functions.txt
            echo 'General Functions change detected: deployable export set selected (Eventarc KYC triggers deferred until IAM is granted).'
            echo '2' > /tmp/market-cash-batch-size.txt
          fi

          echo 'Functions selected:'
          cat /tmp/market-cash-functions.txt
          test -s /tmp/market-cash-functions.txt

      - name: Deploy Cloud Functions conservatively with retry
        shell: bash
        run: |
          set -uo pipefail
          mapfile -t functions_to_deploy < /tmp/market-cash-functions.txt
          batch_size="$(cat /tmp/market-cash-batch-size.txt)"

          for ((i=0; i<${#functions_to_deploy[@]}; i+=batch_size)); do
            only=''
            batch=()
            for ((j=i; j<i+batch_size && j<${#functions_to_deploy[@]}; j++)); do
              fn="${functions_to_deploy[$j]}"
              [ -z "$fn" ] && continue
              batch+=("$fn")
              if [ -z "$only" ]; then
                only="functions:${fn}"
              else
                only="${only},functions:${fn}"
              fi
            done

            [ -z "$only" ] && continue
            success=0
            for attempt in 1 2 3; do
              echo "Deploying: ${batch[*]} (attempt ${attempt}/3)"
              if firebase deploy --only "$only" --project automarket-fintech --non-interactive; then
                success=1
                break
              fi
              wait_seconds=$((attempt * 35))
              echo "Deployment failure; retrying in ${wait_seconds}s..."
              sleep "$wait_seconds"
            done

            if [ "$success" -ne 1 ]; then
              echo "Deployment failed after 3 attempts: ${batch[*]}"
              exit 1
            fi
            sleep 12
          done