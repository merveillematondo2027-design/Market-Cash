name: Market-Cash CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-package-lock --no-audit --no-fund
      - name: TypeScript
        run: npm run lint
      - name: Production build
        run: npm run build
      - name: Install Cloud Functions dependencies
        working-directory: functions
        run: npm install --no-package-lock --no-audit --no-fund
      - name: Cloud Functions TypeScript
        working-directory: functions
        run: npm run build

  android-admin-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android build tools
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'

      - name: Setup Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Restore persistent Android signing key
        if: github.event_name != 'pull_request'
        env:
          ANDROID_ADMIN_KEYSTORE_BASE64: ${{ secrets.ANDROID_ADMIN_KEYSTORE_BASE64 }}
          ANDROID_ADMIN_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_ADMIN_KEYSTORE_PASSWORD }}
        run: bash android-admin/ci/restore-signing-key.sh

      - name: Verify Market-Cash signing SHA-1
        if: github.event_name != 'pull_request'
        env:
          ANDROID_ADMIN_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_ADMIN_KEYSTORE_PASSWORD }}
        run: |
          ACTUAL_SHA1=$(keytool -list -v \
            -keystore "$ANDROID_ADMIN_KEYSTORE_PATH" \
            -storetype PKCS12 \
            -storepass "$ANDROID_ADMIN_KEYSTORE_PASSWORD" \
            -alias market-cash-admin | sed -n 's/^[[:space:]]*SHA1: //p')
          EXPECTED_SHA1='37:81:21:19:B4:DA:F9:74:7A:EA:A6:82:67:AC:B7:70:8D:67:1F:23'
          echo "Signing SHA-1: $ACTUAL_SHA1"
          test "$ACTUAL_SHA1" = "$EXPECTED_SHA1"

      - name: Build Market-Cash Admin APK
        env:
          ANDROID_ADMIN_KEYSTORE_PASSWORD: ${{ github.event_name != 'pull_request' && secrets.ANDROID_ADMIN_KEYSTORE_PASSWORD || '' }}
        working-directory: android-admin
        run: gradle assembleDebug --no-daemon

      - name: Verify built APK certificate
        if: github.event_name != 'pull_request'
        run: "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs android-admin/app/build/outputs/apk/debug/app-debug.apk

      - name: Rename APK
        run: cp android-admin/app/build/outputs/apk/debug/app-debug.apk Market-Cash-Admin-0.2.0.apk

      - name: Upload Market-Cash Admin APK
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: Market-Cash-Admin-0.2.0
          path: Market-Cash-Admin-0.2.0.apk
          if-no-files-found: error
          retention-days: 30
