name: Market-Cash CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-package-lock --no-audit --no-fund
      - name: TypeScript
        run: npm run lint
      - name: Production build
        run: npm run build
      - name: Install Cloud Functions dependencies
        working-directory: functions
        run: npm install --no-package-lock --no-audit --no-fund
      - name: Cloud Functions TypeScript
        working-directory: functions
        run: npm run build

  android-admin-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build Market-Cash Admin APK
        working-directory: android-admin
        run: gradle assembleDebug --no-daemon

      - name: Rename APK
        run: cp android-admin/app/build/outputs/apk/debug/app-debug.apk Market-Cash-Admin-0.2.0.apk

      - name: Upload Market-Cash Admin APK
        uses: actions/upload-artifact@v4
        with:
          name: Market-Cash-Admin-0.2.0
          path: Market-Cash-Admin-0.2.0.apk
          if-no-files-found: error
          retention-days: 30
