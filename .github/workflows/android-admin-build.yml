name: Android Admin APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "android-admin/**"
      - ".github/workflows/android-admin-build.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      ANDROID_ADMIN_KEYSTORE_PATH: ${{ github.workspace }}/android-admin/.signing/market-cash-admin.p12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - name: Restore persistent Android signing key
        env:
          ANDROID_ADMIN_KEYSTORE_BASE64: ${{ secrets.ANDROID_ADMIN_KEYSTORE_BASE64 }}
          ANDROID_ADMIN_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_ADMIN_KEYSTORE_PASSWORD }}
        run: bash android-admin/ci/restore-signing-key.sh
      - name: Verify persistent signing SHA fingerprints
        env:
          ANDROID_ADMIN_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_ADMIN_KEYSTORE_PASSWORD }}
        run: |
          keytool -list -v \
            -keystore "$ANDROID_ADMIN_KEYSTORE_PATH" \
            -storetype PKCS12 \
            -storepass "$ANDROID_ADMIN_KEYSTORE_PASSWORD" \
            -alias market-cash-admin | grep -E "SHA1:|SHA256:"
      - name: Build internal debug APK
        env:
          ANDROID_ADMIN_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_ADMIN_KEYSTORE_PASSWORD }}
        run: gradle -p android-admin :app:assembleDebug
      - name: Verify built APK signing certificate
        run: "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs android-admin/app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: market-cash-admin-debug
          path: android-admin/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
