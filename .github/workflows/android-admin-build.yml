name: Android Admin APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'android-admin/**'
      - '.github/workflows/android-admin-build.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK 36
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Build internal debug APK
        run: gradle -p android-admin :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: market-cash-admin-debug
          path: android-admin/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
