name: Deploy corrected Market-Cash V4 payment APIs

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-payment-api-v4-once.yml'

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Functions dependencies
        working-directory: functions
        run: npm install --no-audit --no-fund
      - name: Build Functions
        working-directory: functions
        run: npm run build
      - name: Reduce Gen2 CPU
        run: |
          python3 <<'PY'
          from pathlib import Path
          changed=0
          for p in Path('functions/lib').rglob('*.js'):
              s=p.read_text()
              n=s.replace('{ region: REGION }', "{ region: REGION, cpu: 'gcf_gen1' }")
              if n!=s:
                  p.write_text(n); changed+=1
          print('patched',changed)
          PY
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: 'projects/153173040202/locations/global/workloadIdentityPools/github-actions/providers/market-cash'
          service_account: 'market-cash-github-deployer@automarket-fintech.iam.gserviceaccount.com'
      - name: Install Firebase CLI
        run: npm install -g firebase-tools
      - name: Deploy payment APIs
        run: firebase deploy --only functions:marketCashApiCardPayment,functions:marketCashApiCardPaymentByKey --project automarket-fintech --non-interactive
