name: Market-Cash Functions CI

on:
  pull_request:
    paths:
      - 'functions/**'
      - 'firebase.json'
  push:
    branches: [main]
    paths:
      - 'functions/**'
      - 'firebase.json'

jobs:
  functions-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: functions
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build Functions
        run: npm run build
