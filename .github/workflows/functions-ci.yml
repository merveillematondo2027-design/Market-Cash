name: Market-Cash Functions CI

on:
  pull_request:
    paths:
      - 'functions/**'
      - 'firebase.json'
  push:
    branches: [main]
    paths:
      - 'functions/**'
      - 'firebase.json'

jobs:
  functions-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: functions
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: functions/package.json
      - run: npm install --no-audit --no-fund
      - run: npm run build
