name: Biometric and manual deposit fix

on:
  push:
    branches: [main]
    paths:
      - 'scripts/fix_biometric_and_manual_deposit.py'
      - '.github/workflows/biometric-manual-deposit-fix-once.yml'
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply fixes
        run: python3 scripts/fix_biometric_and_manual_deposit.py

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Build frontend
        run: npm run build

      - name: Commit fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/SecurityConfirmModal.tsx src/hooks/useSensitiveReveal.ts src/pages/client/ClientHome.tsx src/pages/client/WalletAction.tsx src/pages/client/Settings.tsx src/services/deviceSecurityService.ts
          git commit -m "Fix biometric prompts and restore manual deposit" || true
          git push origin main

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/153173040202/locations/global/workloadIdentityPools/github-actions/providers/market-cash
          service_account: market-cash-github-deployer@automarket-fintech.iam.gserviceaccount.com

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Deploy Hosting
        run: firebase deploy --only hosting --project automarket-fintech --non-interactive
