name: Current objectives security audit fix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/current-objectives-security-audit-fix-once.yml'

permissions:
  contents: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply audited fixes
        run: python3 scripts/current_objectives_security_audit_fix.py

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install frontend dependencies
        run: npm install --no-package-lock --no-audit --no-fund

      - name: TypeScript frontend
        run: npm run lint

      - name: Build frontend
        run: npm run build

      - name: Install Functions dependencies
        working-directory: functions
        run: npm install --no-package-lock --no-audit --no-fund

      - name: Build Functions
        working-directory: functions
        run: npm run build

      - name: Commit audited fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/SecurityConfirmModal.tsx src/hooks/useSensitiveReveal.ts src/services/deviceSecurityService.ts src/pages/auth/PinScreen.tsx src/pages/client/ClientHome.tsx src/pages/client/Settings.tsx src/pages/client/Transactions.tsx functions/src/transactionFees.ts functions/src/developerPayments.ts
          git commit -m "Auto-launch biometrics and repair current Market-Cash security flows" || true
          git push origin main

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: 'projects/153173040202/locations/global/workloadIdentityPools/github-actions/providers/market-cash'
          service_account: 'market-cash-github-deployer@automarket-fintech.iam.gserviceaccount.com'

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Deploy affected Functions
        run: firebase deploy --only functions:updateSecurityPreferences,functions:marketCashTransferWithCvv,functions:merchantPaymentFromLocalCardWithCvvV2,functions:agentLocalCardCashOutWithCvv,functions:agentCashInByMarketCashIdV2,functions:marketCashApiCardPayment,functions:marketCashApiCardPaymentByKey --project automarket-fintech --non-interactive

      - name: Deploy Hosting
        run: firebase deploy --only hosting --project automarket-fintech --non-interactive
