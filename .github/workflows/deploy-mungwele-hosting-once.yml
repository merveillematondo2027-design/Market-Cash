name: Deploy Mungwele IA Hosting Once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-mungwele-hosting-once.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout MUNGWELE IA
        uses: actions/checkout@v4
        with:
          repository: merveillematondo2027-design/MUNGWELE-IA-STUDIO
          ref: main

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build MUNGWELE IA
        run: npm run build

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: 'projects/153173040202/locations/global/workloadIdentityPools/github-actions/providers/market-cash'
          service_account: 'market-cash-github-deployer@automarket-fintech.iam.gserviceaccount.com'

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Deploy MUNGWELE IA to classic Firebase Hosting
        run: firebase deploy --only hosting --project diablo-design-ai --non-interactive
